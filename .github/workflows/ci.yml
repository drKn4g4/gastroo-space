name: "\U0001F916 CI Pipeline"

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ══════════════════════════════════════════════════════════════
  # 🔐 Step 1 — Security scan
  # ══════════════════════════════════════════════════════════════
  secrets-scan:
    name: "🔐 1. Secrets scan"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: "🔍 Gitleaks — scan for leaked secrets"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════════════════════════
  # 📐 Step 2 — Code quality (lint)
  # ══════════════════════════════════════════════════════════════
  lint-app:
    name: "📐 2a. Lint app"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: "📥 Install dependencies"
        run: npm ci

      - name: "🔎 ESLint — check app code"
        run: npm run lint

  lint-functions:
    name: "📐 2b. Lint functions"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: "📥 Install functions dependencies"
        run: npm ci --prefix functions

      - name: "🔎 ESLint — check functions code"
        run: npm --prefix functions run lint

  # ══════════════════════════════════════════════════════════════
  # 🔬 Step 3 — TypeScript type check
  # ══════════════════════════════════════════════════════════════
  typecheck:
    name: "🔬 3. TypeScript check"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: "📥 Install dependencies"
        run: npm ci

      - name: "🧪 tsc --noEmit"
        run: npx tsc -p tsconfig.json --noEmit

  # ══════════════════════════════════════════════════════════════
  # 🧪 Step 4 — Unit tests
  # ══════════════════════════════════════════════════════════════
  unit-tests:
    name: "🧪 4. Unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: gastroo-4f0a3.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: gastroo-4f0a3
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: gastroo-4f0a3.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: "📥 Install dependencies"
        run: npm ci

      - name: "🧪 Vitest — run unit tests"
        run: npm run test

  # ══════════════════════════════════════════════════════════════
  # 🔨 Step 5 — Build verification
  # ══════════════════════════════════════════════════════════════
  build-app:
    name: "🔨 5a. Build app"
    needs: [secrets-scan, lint-app, typecheck, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: gastroo-4f0a3.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: gastroo-4f0a3
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: gastroo-4f0a3.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: "📥 Install dependencies"
        run: npm ci

      - name: "🏗️ Next.js build"
        run: npm run build

  build-functions:
    name: "🔨 5b. Build functions"
    needs: [secrets-scan, lint-functions]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: "📥 Install functions dependencies"
        run: npm ci --prefix functions

      - name: "🏗️ TypeScript compile functions"
        run: npm --prefix functions run build

  # ══════════════════════════════════════════════════════════════
  # ✅ Step 6 — CI Gate (all checks passed)
  # ══════════════════════════════════════════════════════════════
  ci-passed:
    name: "✅ 6. All checks passed"
    needs: [secrets-scan, lint-app, lint-functions, typecheck, unit-tests, build-app, build-functions]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: "🎉 CI Summary"
        run: |
          echo "╔══════════════════════════════════════════════╗"
          echo "║         🍳 GASTROO CI PIPELINE 🍳           ║"
          echo "╠══════════════════════════════════════════════╣"
          echo "║  🔐 Secrets scan:    ${{ needs.secrets-scan.result }}"
          echo "║  📐 Lint app:        ${{ needs.lint-app.result }}"
          echo "║  📐 Lint functions:  ${{ needs.lint-functions.result }}"
          echo "║  🔬 TypeScript:      ${{ needs.typecheck.result }}"
          echo "║  🧪 Unit tests:      ${{ needs.unit-tests.result }}"
          echo "║  🔨 Build app:       ${{ needs.build-app.result }}"
          echo "║  🔨 Build functions: ${{ needs.build-functions.result }}"
          echo "╚══════════════════════════════════════════════╝"

      - name: "🚫 Fail if any job failed"
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "❌ One or more CI jobs failed or were cancelled."
          exit 1
