name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Firebase client config needed for Next.js build (prerender)
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: gastroo-4f0a3.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: gastroo-4f0a3
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: gastroo-4f0a3.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Lint
        run: npm run lint

      - name: Lint Functions
        run: npm --prefix functions run lint

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Unit tests
        run: npm run test

      - name: Build app
        run: npm run build
