name: "\U0001F680 CD Deploy to Firebase"

on:
  push:
    branches: [main]
    paths-ignore:
      - CHANGELOG.md
      - package.json
      - functions/package.json
  workflow_dispatch:
    inputs:
      target_env:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      run_smoke:
        description: Run post-deploy smoke tests
        required: false
        default: true
        type: boolean
      skip_apphosting:
        description: Skip App Hosting deploy
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # ══════════════════════════════════════════════════════════════
  # 🎯 Step 1 — Resolve target environment
  # ══════════════════════════════════════════════════════════════
  resolve-target:
    name: "🎯 1. Resolve environment"
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.resolve.outputs.target_env }}
      gcp_project: ${{ steps.resolve.outputs.gcp_project }}
      app_base_url: ${{ steps.resolve.outputs.app_base_url }}
    steps:
      - id: resolve
        name: "🔍 Determine deploy target"
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET_ENV="${{ inputs.target_env }}"
          else
            TARGET_ENV="staging"
          fi

          GCP_PROJECT="gastroo-4f0a3"

          if [[ "$TARGET_ENV" == "production" ]]; then
            APP_BASE_URL="${{ secrets.APP_BASE_URL_PRODUCTION }}"
          else
            APP_BASE_URL="${{ secrets.APP_BASE_URL_STAGING }}"
          fi

          echo "╔══════════════════════════════════════════════╗"
          echo "║         🍳 GASTROO CD PIPELINE 🍳           ║"
          echo "╠══════════════════════════════════════════════╣"
          echo "║  🎯 Environment:  $TARGET_ENV"
          echo "║  🏗️ GCP Project:  $GCP_PROJECT"
          echo "║  🌐 Base URL:     ${APP_BASE_URL:-<not set>}"
          echo "╚══════════════════════════════════════════════╝"

          echo "target_env=$TARGET_ENV" >> "$GITHUB_OUTPUT"
          echo "gcp_project=$GCP_PROJECT" >> "$GITHUB_OUTPUT"
          echo "app_base_url=$APP_BASE_URL" >> "$GITHUB_OUTPUT"

  # ══════════════════════════════════════════════════════════════
  # 🏷️ Step 2 — Version bump + changelog
  # ══════════════════════════════════════════════════════════════
  release-version:
    name: "🏷️ 2. Bump version"
    runs-on: ubuntu-latest
    needs: resolve-target
    steps:
      - name: "📥 Checkout (full history)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: "📝 Bump version and update changelog"
        id: release
        shell: bash
        run: |
          OUT="$(node scripts/bump-version-and-changelog.mjs \
            --env "${{ needs.resolve-target.outputs.target_env }}" \
            --target "gcp" \
            --sha "${{ github.sha }}" \
            --run-number "${{ github.run_number }}")"
          echo "$OUT"
          VERSION="${OUT#NEXT_VERSION=}"
          echo "🏷️ New version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: "📤 Commit release metadata"
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json functions/package.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "ℹ️ No release metadata changes"
            exit 0
          fi
          git commit -m "chore(release): bump to ${{ steps.release.outputs.version }} [skip ci]"
          git push
          echo "✅ Release metadata committed"

  # ══════════════════════════════════════════════════════════════
  # 🔑 Step 3 — Validate environment secrets
  # ══════════════════════════════════════════════════════════════
  validate-env:
    name: "🔑 3. Validate env vars"
    runs-on: ubuntu-latest
    needs: [resolve-target, release-version]
    environment: ${{ needs.resolve-target.outputs.target_env }}
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      SEED_ADMIN_KEY: ${{ secrets.SEED_ADMIN_KEY }}
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          ref: main

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: "📥 Install dependencies"
        run: npm ci

      - name: "🔑 Validate deploy environment"
        run: npm run deploy:env:check

  # ══════════════════════════════════════════════════════════════
  # 🔨 Step 4 — Build functions
  # ══════════════════════════════════════════════════════════════
  build-functions:
    name: "🔨 4. Build functions"
    runs-on: ubuntu-latest
    needs: [resolve-target, validate-env]
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          ref: main

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: "📥 Install functions dependencies"
        run: npm ci --prefix functions

      - name: "🏗️ Compile Cloud Functions"
        run: npm --prefix functions run build

  # ══════════════════════════════════════════════════════════════
  # 🏗️ Step 5 — Build Next.js app
  # ══════════════════════════════════════════════════════════════
  build-app:
    name: "🏗️ 5. Build app"
    runs-on: ubuntu-latest
    needs: [resolve-target, validate-env]
    environment: ${{ needs.resolve-target.outputs.target_env }}
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          ref: main

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: "📥 Install dependencies"
        run: npm ci

      - name: "🏗️ Next.js production build"
        run: npm run build

  # ══════════════════════════════════════════════════════════════
  # 🔥 Step 6 — Deploy Firestore rules + indexes
  # ══════════════════════════════════════════════════════════════
  deploy-firestore:
    name: "🔥 6. Deploy Firestore rules"
    runs-on: ubuntu-latest
    needs: [resolve-target, validate-env]
    environment: ${{ needs.resolve-target.outputs.target_env }}
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          ref: main

      - name: "🔧 Setup Firebase CLI"
        run: npm i -g firebase-tools

      - name: "🔐 Write service account key"
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GASTROO_4F0A3 }}' > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: "🔥 Deploy Firestore rules + indexes"
        run: |
          echo "🔥 Deploying Firestore rules & indexes..."
          firebase deploy --only firestore --project "${{ needs.resolve-target.outputs.gcp_project }}"
          echo "✅ Firestore deployed"

  # ══════════════════════════════════════════════════════════════
  # 🪣 Step 7 — Deploy Storage rules
  # ══════════════════════════════════════════════════════════════
  deploy-storage:
    name: "🪣 7. Deploy Storage rules"
    runs-on: ubuntu-latest
    needs: [resolve-target, validate-env]
    environment: ${{ needs.resolve-target.outputs.target_env }}
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          ref: main

      - name: "🔧 Setup Firebase CLI"
        run: npm i -g firebase-tools

      - name: "🔐 Write service account key"
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GASTROO_4F0A3 }}' > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: "🪣 Deploy Storage rules"
        run: |
          echo "🪣 Deploying Storage security rules..."
          firebase deploy --only storage --project "${{ needs.resolve-target.outputs.gcp_project }}"
          echo "✅ Storage rules deployed"

  # ══════════════════════════════════════════════════════════════
  # ⚡ Step 8 — Deploy Cloud Functions
  # ══════════════════════════════════════════════════════════════
  deploy-functions:
    name: "⚡ 8. Deploy Cloud Functions"
    runs-on: ubuntu-latest
    needs: [resolve-target, build-functions]
    environment: ${{ needs.resolve-target.outputs.target_env }}
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          ref: main

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: "📥 Install functions dependencies"
        run: npm ci --prefix functions

      - name: "🏗️ Build functions"
        run: npm --prefix functions run build

      - name: "🔧 Setup Firebase CLI"
        run: npm i -g firebase-tools

      - name: "🔐 Write service account key"
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GASTROO_4F0A3 }}' > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: "⚡ Deploy Cloud Functions"
        run: |
          echo "⚡ Deploying Cloud Functions..."
          firebase deploy --only functions --project "${{ needs.resolve-target.outputs.gcp_project }}"
          echo "✅ Cloud Functions deployed"

  # ══════════════════════════════════════════════════════════════
  # 🌐 Step 9 — Deploy App Hosting
  # ══════════════════════════════════════════════════════════════
  deploy-apphosting:
    name: "🌐 9. Deploy App Hosting"
    runs-on: ubuntu-latest
    needs: [resolve-target, build-app, deploy-firestore, deploy-storage, deploy-functions]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_apphosting != true }}
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          ref: main

      - name: "🔧 Setup Firebase CLI"
        run: npm i -g firebase-tools

      - name: "🔐 Write service account key"
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GASTROO_4F0A3 }}' > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: "🌐 Deploy App Hosting rollout"
        shell: bash
        run: |
          BACKEND_ID="$(node -e "const j=JSON.parse(require('fs').readFileSync('firebase.json','utf8')); process.stdout.write(j?.apphosting?.backendId||'');")"
          if [[ -z "$BACKEND_ID" ]]; then
            echo "⚠️ No apphosting.backendId in firebase.json — skipping"
            exit 0
          fi
          if firebase --help 2>/dev/null | grep -q "apphosting:rollouts:create"; then
            echo "🌐 Creating App Hosting rollout for backend: $BACKEND_ID"
            firebase apphosting:rollouts:create --project "${{ needs.resolve-target.outputs.gcp_project }}" -b main -f "$BACKEND_ID"
            echo "✅ App Hosting rollout created"
          else
            echo "⚠️ App Hosting CLI not available — upgrade firebase-tools or deploy via GitHub push"
          fi

  # ══════════════════════════════════════════════════════════════
  # 🧪 Step 10 — Post-deploy smoke tests
  # ══════════════════════════════════════════════════════════════
  smoke-tests:
    name: "🧪 10. Post-deploy smoke"
    runs-on: ubuntu-latest
    needs: [resolve-target, deploy-firestore, deploy-storage, deploy-functions, deploy-apphosting]
    if: ${{ always() && !contains(needs.*.result, 'failure') && (github.event_name != 'workflow_dispatch' || inputs.run_smoke == true) }}
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🧪 Run smoke tests"
        shell: bash
        run: |
          if [[ -z "${{ needs.resolve-target.outputs.app_base_url }}" ]]; then
            echo "⚠️ Missing APP_BASE_URL for target env — skipping smoke tests"
            exit 0
          fi
          echo "╔══════════════════════════════════════════════╗"
          echo "║       🧪 POST-DEPLOY SMOKE TESTS 🧪        ║"
          echo "╠══════════════════════════════════════════════╣"
          echo "║  🌐 URL: ${{ needs.resolve-target.outputs.app_base_url }}"
          echo "║  🎯 Env: ${{ needs.resolve-target.outputs.target_env }}"
          echo "╚══════════════════════════════════════════════╝"
          bash scripts/smoke-postdeploy.sh \
            --base-url "${{ needs.resolve-target.outputs.app_base_url }}" \
            --project-id "gastroo-4f0a3"

      - name: "🎉 Deploy complete"
        run: |
          echo "╔══════════════════════════════════════════════╗"
          echo "║     🍳 GASTROO DEPLOY COMPLETE 🍳           ║"
          echo "║     🎯 ${{ needs.resolve-target.outputs.target_env }} environment"
          echo "╚══════════════════════════════════════════════╝"
