name: CD Firebase GCP Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - CHANGELOG.md
      - package.json
      - functions/package.json
  workflow_dispatch:
    inputs:
      target_env:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      run_smoke:
        description: Run post-deploy smoke tests
        required: false
        default: true
        type: boolean
      skip_apphosting:
        description: Skip App Hosting deploy
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # ── 1. Resolve target environment ──────────────────────────
  resolve-target:
    name: "1. Resolve environment"
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.resolve.outputs.target_env }}
      gcp_project: ${{ steps.resolve.outputs.gcp_project }}
      app_base_url: ${{ steps.resolve.outputs.app_base_url }}
    steps:
      - id: resolve
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET_ENV="${{ inputs.target_env }}"
          else
            TARGET_ENV="staging"
          fi

          GCP_PROJECT="gastroo-4f0a3"

          if [[ "$TARGET_ENV" == "production" ]]; then
            APP_BASE_URL="${{ secrets.APP_BASE_URL_PRODUCTION }}"
          else
            APP_BASE_URL="${{ secrets.APP_BASE_URL_STAGING }}"
          fi

          echo "target_env=$TARGET_ENV" >> "$GITHUB_OUTPUT"
          echo "gcp_project=$GCP_PROJECT" >> "$GITHUB_OUTPUT"
          echo "app_base_url=$APP_BASE_URL" >> "$GITHUB_OUTPUT"

  # ── 2. Release version bump ────────────────────────────────
  release-version:
    name: "2. Bump version"
    runs-on: ubuntu-latest
    needs: resolve-target
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bump version and update changelog
        id: release
        shell: bash
        run: |
          OUT="$(node scripts/bump-version-and-changelog.mjs \
            --env "${{ needs.resolve-target.outputs.target_env }}" \
            --target "gcp" \
            --sha "${{ github.sha }}" \
            --run-number "${{ github.run_number }}")"
          echo "$OUT"
          VERSION="${OUT#NEXT_VERSION=}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit release metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json functions/package.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No release metadata changes"
            exit 0
          fi
          git commit -m "chore(release): bump to ${{ steps.release.outputs.version }} [skip ci]"
          git push

  # ── 3. Validate environment ────────────────────────────────
  validate-env:
    name: "3. Validate env vars"
    runs-on: ubuntu-latest
    needs: [resolve-target, release-version]
    environment: ${{ needs.resolve-target.outputs.target_env }}
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      SEED_ADMIN_KEY: ${{ secrets.SEED_ADMIN_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run deploy:env:check

  # ── 4. Build ───────────────────────────────────────────────
  build:
    name: "4. Build app + functions"
    runs-on: ubuntu-latest
    needs: [resolve-target, validate-env]
    environment: ${{ needs.resolve-target.outputs.target_env }}
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm ci --prefix functions
      - name: Build functions
        run: npm --prefix functions run build
      - name: Build app
        run: npm run build

  # ── 5. Deploy ──────────────────────────────────────────────
  deploy:
    name: "5. Deploy to Firebase"
    runs-on: ubuntu-latest
    needs: [resolve-target, build]
    environment: ${{ needs.resolve-target.outputs.target_env }}
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REDIRECT_URI: ${{ secrets.GOOGLE_DRIVE_REDIRECT_URI }}
      GOOGLE_CALENDAR_CLIENT_ID: ${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}
      GOOGLE_CALENDAR_REDIRECT_URI: ${{ secrets.GOOGLE_CALENDAR_REDIRECT_URI }}
      GOOGLE_WORKSPACE_CLIENT_ID: ${{ secrets.GOOGLE_WORKSPACE_CLIENT_ID }}
      GOOGLE_WORKSPACE_CLIENT_SECRET: ${{ secrets.GOOGLE_WORKSPACE_CLIENT_SECRET }}
      GOOGLE_WORKSPACE_REDIRECT_URI: ${{ secrets.GOOGLE_WORKSPACE_REDIRECT_URI }}
      SEED_ADMIN_KEY: ${{ secrets.SEED_ADMIN_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm --prefix functions run build

      - name: Setup Firebase CLI
        run: npm i -g firebase-tools

      - name: Write service account key
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GASTROO_4F0A3 }}' > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Deploy Firebase resources
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.skip_apphosting }}" == "true" ]]; then
            bash scripts/deploy-firebase.sh --project "${{ needs.resolve-target.outputs.gcp_project }}" --skip-apphosting
          else
            bash scripts/deploy-firebase.sh --project "${{ needs.resolve-target.outputs.gcp_project }}"
          fi

  # ── 6. Smoke tests ─────────────────────────────────────────
  smoke-tests:
    name: "6. Post-deploy smoke"
    runs-on: ubuntu-latest
    needs: [resolve-target, deploy]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_smoke == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke tests
        shell: bash
        run: |
          if [[ -z "${{ needs.resolve-target.outputs.app_base_url }}" ]]; then
            echo "Missing APP_BASE_URL for target env; skipping smoke tests"
            exit 0
          fi
          bash scripts/smoke-postdeploy.sh \
            --base-url "${{ needs.resolve-target.outputs.app_base_url }}" \
            --project-id "gastroo-4f0a3"
