# ── Runtime Configuration ──────────────────────────────────────────────────
runtimeConfig:
  nodeVersion: 22

# ── Build Configuration ─────────────────────────────────────────────────────
buildConfig:
  rootDir: /

# ── Backend Settings (Cloud Run) ──────────────────────────────────────────
runConfig:
  minInstances: 1
  maxInstances: 10
  memoryMiB: 1024

# ── Environment Variables & Secrets ────────────────────────────────────────
env:
  - variable: NODE_ENV
    value: production
    availability: [BUILD, RUNTIME]

  # ── Firebase Config (Podstawowa konfiguracja klienta) ────────────────────
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: gastroo-4f0a3.firebaseapp.com
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: gastroo-4f0a3
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: gastroo-4f0a3.firebasestorage.app
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
    availability: [BUILD, RUNTIME]

  # ── FEATURE FLAGS (Wyłączamy to, czego jeszcze nie masz) ─────────────────
  - variable: NEXT_PUBLIC_FEATURE_GOOGLE_CALENDAR
    value: "false" # <--- WYŁĄCZONE
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FEATURE_GOOGLE_CHAT
    value: "false" # <--- WYŁĄCZONE
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FEATURE_ADVANCED_FLOORPLAN
    value: "false" # <--- WYŁĄCZONE (opcjonalnie)
    availability: [BUILD, RUNTIME]

  # ── Mocks & Dev Flags ────────────────────────────────────────────────────
  - variable: NEXT_PUBLIC_USE_EMULATORS
    value: "false"
    availability: [BUILD, RUNTIME]
    
  - variable: MOCK_INTEGRATIONS
    value: "true" # Możesz włączyć mocki, żeby apka nie sypała błędami w UI
    availability: [RUNTIME]

# UWAGA: Jeśli Twój skrypt env.ts nadal krzyczy o GOOGLE_DRIVE_CLIENT_ID, 
# mimo że flaga jest na false, będziesz musiał na chwilę 
# zakomentować te pola w kodzie walidującym (zazwyczaj env.ts lub next.config.mjs).