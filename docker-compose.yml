services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gastroo-web
    ports:
      - "5202:5202"
    environment:
      NODE_ENV: production
      PORT: 5202
      NEXT_PUBLIC_USE_EMULATORS: "false"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5202/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
